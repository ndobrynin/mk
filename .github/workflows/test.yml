name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test @kidagrad/engine
        run: pnpm --filter @kidagrad/engine test

      - name: Test @kidagrad/api
        run: pnpm --filter @kidagrad/api test

      - name: Build @kidagrad/web
        run: pnpm --filter @kidagrad/web build
