name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://kidagrad:kidagrad@127.0.0.1:5435/kidagrad
      REDIS_URL: redis://127.0.0.1:6380
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kidagrad
          POSTGRES_PASSWORD: kidagrad
          POSTGRES_DB: kidagrad
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U kidagrad -d kidagrad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test @kidagrad/engine
        run: pnpm --filter @kidagrad/engine test

      - name: Migrate @kidagrad/api
        run: pnpm --filter @kidagrad/api exec prisma migrate deploy

      - name: Test @kidagrad/api
        run: pnpm --filter @kidagrad/api test

      - name: Build @kidagrad/web
        run: pnpm --filter @kidagrad/web build
