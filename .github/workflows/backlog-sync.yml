name: Backlog → Issues

on:
  push:
    paths:
      - "docs/backlog/tickets/**"
      - "scripts/backlog-sync-github.py"
      - ".github/workflows/backlog-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backlog-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror tickets to GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/backlog-sync-github.py
